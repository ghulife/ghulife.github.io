<style>
/* ghulife — Layout: phone app. Hero header per tab, scrolling cards, floating bottom dock with a raised Scan button */
:root{
  --bg:#eef1f6; --card:#ffffff; --card2:#f6f8fb; --fg:#121a29; --muted:#5b687b; --line:#dbe1ea;
  --accent:#3b4fd8; --accent-2:#6a5cf0; --accent-soft:#e5e8fd;
  --due:#d1432f; --due-soft:#fde9e5; --done:#1f8a55; --done-soft:#dff3e8;
  --warm:#b8640c; --warm-soft:#fdf0dc; --teal:#0f8a8a; --teal-soft:#dcf2f1;
  --shadow:0 8px 24px rgba(22,32,60,.08); --on:#ffffff;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --card:#151b26; --card2:#1b2230; --fg:#e9edf4; --muted:#96a1b3; --line:#262f3e;
  --accent:#8b9cff; --accent-2:#a596ff; --accent-soft:#1f2648;
  --due:#ff8c7c; --due-soft:#3b1e1a; --done:#5fd193; --done-soft:#14301f;
  --warm:#f3b25d; --warm-soft:#33250f; --teal:#56d0cd; --teal-soft:#11302f;
  --shadow:0 8px 24px rgba(0,0,0,.35); --on:#0c1018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1018; --card:#151b26; --card2:#1b2230; --fg:#e9edf4; --muted:#96a1b3; --line:#262f3e;
  --accent:#8b9cff; --accent-2:#a596ff; --accent-soft:#1f2648;
  --due:#ff8c7c; --due-soft:#3b1e1a; --done:#5fd193; --done-soft:#14301f;
  --warm:#f3b25d; --warm-soft:#33250f; --teal:#56d0cd; --teal-soft:#11302f;
  --shadow:0 8px 24px rgba(0,0,0,.35); --on:#0c1018; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100%}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:-.01em;color:var(--accent);margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;margin:2px 0 0;letter-spacing:-.02em;line-height:1.05}
.ring{--p:0;--c:var(--done);width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:45px;height:45px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.82rem;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;width:50px;padding:8px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);
  display:grid;gap:1px;justify-items:center;cursor:pointer;position:relative}
.pill small{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pill b{font-family:var(--display);font-size:1.2rem}
.pill i{display:block;width:22px;height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.pill i u{display:block;height:100%;background:var(--done)}
.pill.sel{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pill.sel small{color:var(--bg);opacity:.75}
.pill .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--due)}
.pill.isToday:not(.sel){border-color:var(--accent);border-width:2px}
main{padding-block:6px 130px;display:grid;gap:12px;align-content:start}
.hero{border-radius:22px;padding:16px 18px;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;gap:6px;box-shadow:var(--shadow)}
.hero .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:700}
.hero .txt{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.2}
.hero .nx{font-size:.84rem;opacity:.88}
.hero .cd{font-variant-numeric:tabular-nums;font-weight:700}
.nudge{border-radius:18px;background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--warm) 30%,transparent);padding:12px 14px;display:grid;gap:10px}
.nudge h3{margin:0;font-size:.95rem;color:var(--warm);display:flex;gap:8px;align-items:center}
.nrow{display:grid;gap:6px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--warm) 35%,transparent)}
.nrow:first-of-type{border-top:0;padding-top:0}
.nrow .body{font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.chip.ok{background:var(--done);border-color:var(--done);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.due{display:flex;gap:8px;align-items:center;background:var(--due-soft);color:var(--due);font-weight:700;font-size:.88rem;border-radius:14px;padding:10px 12px}
.list{background:var(--card);border-radius:20px;padding:4px 14px;box-shadow:var(--shadow)}
.t{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.t:first-child{border-top:0}
.t input{appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;background:var(--card);transition:transform .15s}
.t input:active{transform:scale(.88)}
.t input:checked{background:var(--done);border-color:var(--done)}
.t input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t.cur{background:var(--accent-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
.t.miss .meta>span:first-child{color:var(--warm);font-weight:700}
.what{min-width:0}
/* tab intro cards */
.tip{--tc:var(--accent);position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 14px;background:var(--card);box-shadow:var(--shadow);display:grid;gap:10px;border:1.5px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.tip::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,var(--tc) 14%,transparent)}
.tiphead{display:flex;gap:12px;align-items:center;position:relative}
.tipicon{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--tc) 16%,var(--card))}
.tiphead small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--tc)}
.tiphead b{font-family:var(--display);font-size:1.25rem;line-height:1.15;display:block;text-wrap:balance}
.tip ul{margin:0;padding-left:18px;display:grid;gap:5px;color:var(--muted);position:relative}
.tipbtn{justify-self:start;position:relative;border:0;border-radius:12px;background:var(--tc);color:var(--on);font-weight:800;padding:9px 16px;cursor:pointer}
.tipbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* egg progress */


/* dock active pill */
nav button:not(.fab).on{background:var(--accent-soft)}
/* intro */
.intro{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:grid;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.obcard{max-width:440px;width:100%;margin:0 auto;box-sizing:border-box;padding-block:22px 28px;display:grid;grid-template-rows:auto auto 1fr;gap:14px;min-height:100%}
.obback{justify-self:start;background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer;padding:4px 0}
.obdots{display:flex;gap:6px;justify-content:center}
.obdots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s}
.obdots i.on{width:24px;background:var(--accent)}
.obdots i.past{background:var(--accent-2)}
.obbody{display:grid;gap:14px;align-content:center}
.obbody h2{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.obbody p{margin:0;color:var(--muted);font-size:1rem}
.obin{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;font-size:1.2rem;font-weight:600;background:var(--card);color:var(--fg)}
.obin:focus-visible{outline:none;border-color:var(--accent)}
.obart{position:relative;height:200px;display:grid;place-items:center}
.obart b{position:relative;width:88px;height:88px;border-radius:28px;display:grid;place-items:center;font-size:2.4rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 40%,transparent)}
.obart.done{height:150px}
.obart.done b{background:var(--done);box-shadow:0 14px 34px color-mix(in srgb,var(--done) 35%,transparent)}
.orb{position:absolute;border-radius:50%;opacity:.9}
.o1{width:54px;height:54px;background:var(--teal-soft);border:2px solid var(--teal);left:14%;top:18%}
.o2{width:38px;height:38px;background:var(--warm-soft);border:2px solid var(--warm);right:16%;top:12%}
.o3{width:46px;height:46px;background:var(--done-soft);border:2px solid var(--done);right:22%;bottom:10%}
@media (prefers-reduced-motion:no-preference){.orb{animation:float 4s ease-in-out infinite}.o2{animation-delay:-1.3s}.o3{animation-delay:-2.6s}.obbody{animation:in .35s ease-out}}
@keyframes float{50%{transform:translateY(-10px)}}
.obtour{display:grid;gap:10px}
.obtour div{display:grid;grid-template-columns:34px 1fr;gap:2px 12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.obtour span{grid-row:span 2;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.obtour small{color:var(--muted);font-size:.85rem}
/* coach */
.chat{display:grid;gap:8px}
.bub{max-width:85%;padding:10px 13px;border-radius:18px;line-height:1.45;overflow-wrap:anywhere}
.bub.ai{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px;justify-self:start}
.bub.me{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on);border-bottom-right-radius:6px;justify-self:end}
.typing{display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none}
.chips button:disabled{opacity:.5}
.composer{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:end;background:var(--card);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
.composer textarea{border:0;background:transparent;resize:none;min-height:40px;padding:10px}
.send{width:46px;height:46px;border-radius:15px;border:0;background:var(--accent);color:var(--on);display:grid;place-items:center;cursor:pointer;font-size:1rem}
.send svg{width:20px;height:20px;fill:var(--on)}
.send:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* calendar timeline */
.cal{position:relative;display:grid;gap:8px}
.cal::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.slot{display:grid;grid-template-columns:50px 1fr;gap:16px;align-items:stretch}
.slot .tm{text-align:right;padding-top:10px;font-variant-numeric:tabular-nums;line-height:1.1}
.slot .tm b{display:block;font-size:.88rem}
.slot .tm small{font-size:.66rem;color:var(--muted);font-weight:700}
.any{display:grid;gap:8px}
.ev{--c:var(--muted);--s:var(--card);display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:var(--s);border-radius:16px;padding:11px 12px;border-left:4px solid var(--c);box-shadow:var(--shadow);cursor:pointer;min-width:0;position:relative}
.ev.sum{--c:var(--accent);--s:color-mix(in srgb,var(--accent-soft) 70%,var(--card))}
.ev.hw{--c:var(--muted)}
.ev.gym,.ev.swim{--c:var(--done);--s:color-mix(in srgb,var(--done-soft) 70%,var(--card))}
.ev.pray,.ev.brk{--c:var(--warm);--s:color-mix(in srgb,var(--warm-soft) 60%,var(--card))}
.ev.cur{outline:2px solid var(--accent);outline-offset:1px}
.ev.miss{border-left-style:dashed}
.ev.miss .meta>span:first-child{color:var(--warm);font-weight:700}
.ev input{appearance:none;width:22px;height:22px;margin:0;border:2px solid var(--c);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.ev input:checked{background:var(--done);border-color:var(--done)}
.ev input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ev input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ev input:checked + .what{opacity:.45}
.ev input:checked + .what .body{text-decoration:line-through}
.ev::before{content:"";position:absolute;left:-14px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.any .ev::before{display:none}
.nowline{display:grid;grid-template-columns:50px 1fr;gap:16px;align-items:center;position:relative}
.nowline span{font-size:.7rem;font-weight:800;color:var(--due);text-align:right;font-variant-numeric:tabular-nums}
.nowline i{height:2px;background:var(--due);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-14px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--due)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
.t input:checked + .what{opacity:.45}
.t input:checked + .what .body{text-decoration:line-through}
.k{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800;border-radius:99px;padding:2px 7px}
.k.sum{background:var(--accent-soft);color:var(--accent)}
.k.hw{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.k.gym,.k.swim{background:var(--done-soft);color:var(--done)}
.k.brk,.k.pray{background:var(--warm-soft);color:var(--warm)}
.k.new{background:var(--accent);color:var(--on)}
.k.miss{background:var(--warm);color:#fff}
.rm{margin-left:auto;background:none;border:0;color:var(--muted);font-size:.75rem;text-decoration:underline;cursor:pointer;padding:0}
.sec{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:8px 2px 0;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted)}
.wk{background:var(--card);border:0;border-radius:18px;padding:13px 15px;display:grid;gap:7px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.wk .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wk b{font-family:var(--display);font-size:1.05rem}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px}
.wk .d{font-size:.82rem;color:var(--due);font-weight:700}
.wk .c{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow)}
.card ul{margin:0;padding-left:18px;display:grid;gap:8px}
.fine{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.lead{margin:0;color:var(--muted)}
.shot{border:2px dashed var(--line);border-radius:18px;min-height:130px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--accent);font-weight:700;cursor:pointer;text-align:center;padding:12px;overflow:hidden;background:var(--card2)}
.shot.teal{color:var(--teal)}
.shot.off{color:var(--muted);cursor:default}
.shot svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.shot img{max-height:240px;border-radius:12px;object-fit:contain}
.stack{display:grid;gap:12px}
textarea,select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:var(--fg);background:var(--card2);resize:vertical}
textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.primary,.ghost{font-weight:700;border-radius:14px;padding:12px 16px;cursor:pointer;border:1px solid var(--accent)}

<script>
/* =========================================================
   ghulife: a personal planner. Every person sets up their own week.
   ========================================================= */
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const CITIES={
 "Riyadh":[24.7136,46.6753,"Asia/Riyadh","uaq"],"Jeddah":[21.4858,39.1925,"Asia/Riyadh","uaq"],"Makkah":[21.3891,39.8579,"Asia/Riyadh","uaq"],
 "Madinah":[24.5247,39.5692,"Asia/Riyadh","uaq"],"Dammam":[26.4207,50.0888,"Asia/Riyadh","uaq"],"Khobar":[26.2172,50.1971,"Asia/Riyadh","uaq"],
 "Abha":[18.2465,42.5117,"Asia/Riyadh","uaq"],"Tabuk":[28.3835,36.5662,"Asia/Riyadh","uaq"],"Dubai":[25.2048,55.2708,"Asia/Dubai","gulf"],
 "Abu Dhabi":[24.4539,54.3773,"Asia/Dubai","gulf"],"Doha":[25.2854,51.531,"Asia/Qatar","gulf"],"Kuwait City":[29.3759,47.9774,"Asia/Kuwait","gulf"],
 "Manama":[26.2235,50.5876,"Asia/Bahrain","gulf"],"Muscat":[23.588,58.3829,"Asia/Muscat","gulf"],"Cairo":[30.0444,31.2357,"Africa/Cairo","egypt"],
 "Amman":[31.9454,35.9284,"Asia/Amman","mwl"],"Istanbul":[41.0082,28.9784,"Europe/Istanbul","mwl"],"Karachi":[24.8607,67.0011,"Asia/Karachi","karachi"],
 "Lahore":[31.5204,74.3587,"Asia/Karachi","karachi"],"Jakarta":[-6.2088,106.8456,"Asia/Jakarta","mwl"],"Kuala Lumpur":[3.139,101.6869,"Asia/Kuala_Lumpur","mwl"],
 "London":[51.5072,-0.1276,"Europe/London","mwl"],"Paris":[48.8566,2.3522,"Europe/Paris","mwl"],"Berlin":[52.52,13.405,"Europe/Berlin","mwl"],
 "New York":[40.7128,-74.006,"America/New_York","isna"],"Chicago":[41.8781,-87.6298,"America/Chicago","isna"],"Los Angeles":[34.0522,-118.2437,"America/Los_Angeles","isna"],
 "Toronto":[43.6532,-79.3832,"America/Toronto","isna"],"Sydney":[-33.8688,151.2093,"Australia/Sydney","mwl"]
};
/* Calculation methods: [fajr angle, isha angle or minutes after maghrib] */
const METHODS={uaq:[18.5,"90m"],gulf:[19.5,"90m"],mwl:[18,17],isna:[15,15],egypt:[19.5,17.5],karachi:[18,18]};
const ACT=[["Light (little or no training)",0],["Active (train 3-4 days a week)",1],["Very active (train 5+ days a week)",2]];

/* ---------- State ---------- */
const BLANK={onboarded:false,name:"",schoolDays:[0,1,2,3,4],schoolStart:"07:30",schoolEnd:"14:30",wake:"06:00",bed:"22:30",
  trainDays:[],trainTime:"17:30",muslim:false,city:"Riyadh",profile:null,tasks:[],saved:{},moved:{},food:{},water:{},fuelPlan:null,seenTabs:{},theme:"system",lang:(()=>{const l=(navigator.language||"en").slice(0,2);return l==="ar"||l==="es"?l:"en"})()};
let S=JSON.parse(JSON.stringify(BLANK));
try{const o=JSON.parse(localStorage.getItem("ghulife")||"null");if(o)S=Object.assign(S,o)}catch(e){}
let docRef=null,writing=false,dirty=false,wTimer=null;
function persist(){try{localStorage.setItem("ghulife",JSON.stringify(S))}catch(e){}
  if(!docRef)return;dirty=true;clearTimeout(wTimer);wTimer=setTimeout(flush,700)}
async function flush(){if(!docRef||writing||!dirty)return;writing=true;dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){}writing=false;if(dirty)flush()}
(async()=>{
  if(!window.__ai?.use)return;
  const [db,user]=await Promise.all([window.__ai.use("db"),window.__ai.use("user")]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  docRef=db.doc("data/users/"+uid+"/ghulife");
  try{const snap=await docRef.get();
    if(snap.exists){S=Object.assign(JSON.parse(JSON.stringify(BLANK)),snap.data());try{localStorage.setItem("ghulife",JSON.stringify(S))}catch(e){}
      applyTheme();document.getElementById("intro").innerHTML="";render()}
    else if(S.onboarded){dirty=true;flush()}}catch(e){}
})();

/* ---------- Helpers ---------- */
let now=new Date();
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
let todayStr=ds(now);
const nowMin=()=>now.getHours()*60+now.getMinutes();
const hm=s=>{const [h,m]=String(s||"0:0").split(":").map(Number);return h*60+(m||0)};
function fmt(min){min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),m=min%60,P=(typeof S!=="undefined"&&S.lang==="ar")?["ص","م"]:(typeof S!=="undefined"&&S.lang==="es")?["a.m.","p.m."]:["AM","PM"],ap=h>=12?P[1]:P[0];h=h%12||12;return `${h}:${String(m).padStart(2,"0")} ${ap}`}
const range=(a,b)=>`${fmt(a)} – ${fmt(b)}`;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const uid=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT=null;function toast(m){const t=document.getElementById("toast");t.textContent=typeof tr==="function"?tr(m):m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function on(i,f){const b=document.getElementById(i);if(b)b.addEventListener("click",f)}

/* ---------- Prayer times (astronomical calculation for the chosen city) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,fixA=a=>((a%360)+360)%360,fixH=h=>((h%24)+24)%24;
function tzOffsetHours(tz,date){
  try{const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(date);
    const g=t=>+p.find(x=>x.type===t).value;const asUTC=Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"));
    return Math.round((asUTC-date.getTime())/60000)/60}catch(e){return -date.getTimezoneOffset()/60}
}
function prayerTimes(dateStr,city){
  const c=CITIES[city]||CITIES.Riyadh,[lat,lng,tz,mk]=c,M=METHODS[mk]||METHODS.mwl;
  const [y,mo,d]=dateStr.split("-").map(Number);
  const tzh=tzOffsetHours(tz,new Date(Date.UTC(y,mo-1,d,12)));
  const jd0=367*y-Math.floor(7*(y+Math.floor((mo+9)/12))/4)+Math.floor(275*mo/9)+d+1721013.5;
  function sun(hour){const D=jd0+hour/24-lng/360-2451545;
    const g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),L=fixA(q+1.915*Math.sin(rad(g))+0.02*Math.sin(rad(2*g)));
    const e=23.439-0.00000036*D,RA=fixH(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15);
    return{decl:deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))),eqt:q/15-RA}}
  const noon=h=>fixH(12-sun(h).eqt);
  function angleTime(angle,h,ccw){const s=sun(h),n=noon(h);
    const x=(-Math.sin(rad(angle))-Math.sin(rad(s.decl))*Math.sin(rad(lat)))/(Math.cos(rad(s.decl))*Math.cos(rad(lat)));
    const T=deg(Math.acos(Math.max(-1,Math.min(1,x))))/15;return n+(ccw?-T:T)}
  function asrTime(h){const s=sun(h);const a=-deg(Math.atan(1/(1+Math.tan(rad(Math.abs(lat-s.decl))))));return angleTime(a,h,false)}
  // two passes for accuracy
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++){
    t={fajr:angleTime(M[0],t.fajr,true),sunrise:angleTime(0.833,t.sunrise,true),dhuhr:noon(t.dhuhr),asr:asrTime(t.asr),
       maghrib:angleTime(0.833,t.maghrib,false),isha:typeof M[1]==="string"?null:angleTime(M[1],t.isha,false)};
    if(t.isha===null)t.isha=t.maghrib+parseInt(M[1])/60;
  }
  const out={};for(const k in t){out[k]=Math.round((t[k]+tzh-lng/15)*60)+(k==="dhuhr"?1:0)}
  return out; // minutes after local midnight
}

/* ---------- Building each day ---------- */
const KIND={sum:"Study",hw:"Homework",due:"Deadline",gym:"Training",swim:"Swim",brk:"Break",pray:"Prayer",routine:"Routine",school:"School"};
function dayItems(dstr){
  const wd=parseD(dstr).getDay(),items=[];
  items.push({id:dstr+":wake",s:hm(S.wake),e:hm(S.wake)+30,text:"Wake up, brush teeth, breakfast",kind:"routine"});
  const school=S.schoolDays.includes(wd);
  if(school)items.push({id:dstr+":school",s:hm(S.schoolStart),e:hm(S.schoolEnd),text:"School",kind:"school",fixed:true});
  if(S.muslim){const p=prayerTimes(dstr,S.city);
    [["fajr","Fajr"],["dhuhr","Dhuhr"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"]].forEach(([k,n])=>{
      let note="";if(school&&p[k]>=hm(S.schoolStart)&&p[k]<hm(S.schoolEnd))note=" (at school)";
      items.push({id:dstr+":p:"+k,s:p[k],e:p[k]+15,text:n+" prayer"+note,kind:"pray",exact:true})})}
  if(S.trainDays.includes(wd))items.push({id:dstr+":train",s:hm(S.trainTime),e:hm(S.trainTime)+60,text:"Training session",kind:"gym"});
  items.push({id:dstr+":bed",s:hm(S.bed)-30,e:hm(S.bed),text:"Brush teeth, phone away, get ready for bed",kind:"routine"});
  S.tasks.filter(t=>t.d===dstr).forEach(t=>items.push({id:t.id,s:t.s??null,e:t.e??null,text:t.text,kind:t.kind||"sum",custom:true,src:t.src}));
  return items.filter(x=>!S.moved[x.id]).sort((a,b)=>(a.s??9999)-(b.s??9999));
}
const label=x=>x.s==null?"Anytime":x.exact?"~"+fmt(x.s):x.e!=null&&x.e!==x.s?range(x.s,x.e):fmt(x.s);
const checkable=x=>!x.fixed;
function dayStats(d){const it=dayItems(d).filter(checkable);return{c:it.filter(x=>S.saved[x.id]).length,n:it.length}}
const DAYS=()=>Array.from({length:14},(_,i)=>addD(todayStr,i-1));
let sel=todayStr,tab="day";
const NAG=new Set(["sum","hw","due","gym","swim"]);
function missed(){
  const out=[];if(!S.since)return out;const sinceD=S.since.slice(0,10),sinceM=+S.since.slice(11);
  for(let i=3;i>=0;i--){const d=addD(todayStr,-i);if(d<sinceD)continue;
    dayItems(d).forEach(x=>{if(S.saved[x.id]||!NAG.has(x.kind))return;if(d===sinceD&&x.s!=null&&x.s<sinceM&&!x.custom)return;
      if(i>0){if(x.custom||x.kind==="gym")out.push({d,...x})}
      else if(x.s!=null&&(x.e??x.s+30)+10<nowMin())out.push({d,...x})})}
  return out;
}
function dueSoon(){return S.tasks.filter(t=>t.kind==="due"&&t.d>=todayStr&&!S.saved[t.id]).sort((a,b)=>a.d<b.d?-1:1)}
const dLabel=d=>{const x=parseD(d);return d===todayStr?tx("Today"):d===addD(todayStr,1)?tx("Tomorrow"):`${wdn(x.getDay())} ${x.getDate()} ${mon(x)}`};

function tr(s){const l=L();if(l==="en"||s==null)return s;const core=String(s).trim();if(!core)return s;
  let out=DICT[l][core];
  if(out==null)for(const [re,fn] of PATTERNS){const m=core.match(re);if(m){out=fn(m,l);break}}
  if(out==null)return s;const i=String(s).indexOf(core);return String(s).slice(0,i)+out+String(s).slice(i+core.length)}
function translateDOM(root){
  document.documentElement.lang=L();document.documentElement.dir=L()==="ar"?"rtl":"ltr";
  if(L()==="en"||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest("script,style,textarea,.bub,[data-notr]"))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  root.querySelectorAll("[placeholder],[aria-label]").forEach(el=>{["placeholder","aria-label"].forEach(a=>{const v=el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t)}})});
  root.querySelectorAll(".bub.ai").forEach(b=>{if(b.childNodes.length===1&&b.firstChild.nodeType===3){const v=tr(b.firstChild.nodeValue);if(v!==b.firstChild.nodeValue)b.firstChild.nodeValue=v}});
}

async function runScan(){
  const note=noteDraft.trim();if(!scanFile&&!note){scanMsg="Add a photo or type the task first.";render();return}
  scanBusy=true;scanMsg="Reading your task. This can take up to a minute.";render();ctl=new AbortController();
  const last=addD(todayStr,12);
  const prompt=`You help a student fit a school task into their planner.
Today is ${todayStr} (${WD[now.getDay()]}), time ${fmt(nowMin())}. Plan dates from ${todayStr} to ${last}.
${aboutMe()}
${scanFile?"The attached photo shows the task (a task sheet, rubric, or a teacher's post). Read it carefully, including any due date.":""}
${note?"The user's note: "+note:""}
Their plan (id | time | item):
${planSummary()}
Split the task into 2 to 6 concrete steps of 20 to 60 minutes, scheduled before the due date, never in the past, in free time (not during school, prayers, training or existing blocks). Steps help them do the work themselves.
Reply with only JSON: {"title":"short name","dueDate":"YYYY-MM-DD or empty","dueTime":"e.g. 11:59 PM or empty","summary":"one or two sentences on what the task asks","steps":[{"date":"YYYY-MM-DD","start":"16:00","end":"16:45","text":"what to do"}]}`;
  try{const r=await AI.json(prompt,{images:scanFile?[scanFile]:undefined,signal:ctl.signal,cache:false});
    const clampD=d=>{d=String(d||"");if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<todayStr)return todayStr;return d>last?last:d};
    const steps=Array.isArray(r?.steps)?r.steps.filter(s=>s&&s.text).map(s=>{const st=/^\d{1,2}:\d{2}$/.test(s.start||"")?hm(s.start):null,en=/^\d{1,2}:\d{2}$/.test(s.end||"")?hm(s.end):st==null?null:st+45;return{date:clampD(s.date),start:st,end:en,text:String(s.text)}}):[];
    if(!steps.length){scanMsg="Couldn't find a task in that. Try a clearer photo or type it out.";scanResult=null}
    else{const dd=/^\d{4}-\d{2}-\d{2}$/.test(r.dueDate||"")?String(r.dueDate):"";scanResult={title:String(r.title||""),dueDate:dd,dueTime:String(r.dueTime||""),summary:String(r.summary||""),steps};scanMsg=""}
  }catch(e){scanMsg=errMsg(e)}
  scanBusy=false;ctl=null;render();
}
function bindScan(){

/* Estimated Energy Requirement, Institute of Medicine Dietary Reference Intakes (2005) */
function fuelNeed(){const p=S.profile;if(!p)return null;const a=+p.act||0,ht=p.height/100,wt=p.weight,age=p.age,f=p.sex==="f";let e;
  if(age<19){const PA=f?[1.16,1.31,1.56]:[1.13,1.26,1.42];e=f?135.3-30.8*age+PA[a]*(10*wt+934*ht)+25:88.5-61.9*age+PA[a]*(26.7*wt+903*ht)+25}
  else{const PA=f?[1.14,1.27,1.45]:[1.11,1.25,1.48];e=f?354-6.91*age+PA[a]*(9.36*wt+726*ht):662-9.53*age+PA[a]*(15.91*wt+539.6*ht)}
  const r=x=>Math.round(x/50)*50;return{lo:r(e*0.93),hi:r(e*1.07)}}

${aboutMe()}

Today (id | time | item | status):
${dayItems(todayStr).map(t=>`${t.id} | ${label(t)} | ${t.text} | ${S.saved[t.id]?"done":"not done"}`).join("\n")}

const COACH_TOOLS=()=>[
 {name:"add_task",description:"Add a task. date YYYY-MM-DD (today to 12 days ahead), start/end 24h 'HH:MM' or omit for anytime, kind one of sum (study), hw, due (deadline), gym, routine. Returns the id.",
  inputSchema:{type:"object",properties:{date:{type:"string"},start:{type:"string"},end:{type:"string"},text:{type:"string"},kind:{type:"string"}},required:["date","text"]},
  execute:i=>{const d=String(i.date||"");if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<todayStr)throw new Error("date must be today or later, YYYY-MM-DD");
    const s=/^\d{1,2}:\d{2}$/.test(i.start||"")?hm(i.start):null,e=/^\d{1,2}:\d{2}$/.test(i.end||"")?hm(i.end):s==null?null:s+45,id=uid();

 {name:"move_task",description:"Move a task (by id) to another date and optional start time 'HH:MM'.",
  inputSchema:{type:"object",properties:{id:{type:"string"},date:{type:"string"},start:{type:"string"}},required:["id","date"]},
  execute:i=>{const id=String(i.id),d=String(i.date);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw new Error("bad date");let it=null,from=null;
    for(let k=-3;k<14;k++){const dd=addD(todayStr,k);const f=dayItems(dd).find(x=>x.id===id);if(f){it=f;from=dd;break}}if(!it)throw new Error("no task with that id");

    if(it.custom){const t=S.tasks.find(x=>x.id===id);const len=t.e!=null&&t.s!=null?t.e-t.s:45;t.d=d;t.s=s;t.e=s==null?null:s+len;t.src="moved"}
    else{S.moved[id]=true;S.tasks.push({id:uid(),d,s,e:s==null?null:s+45,text:it.text,kind:it.kind,src:"moved"})}persist();return{ok:true}}},
 {name:"set_done",description:"Mark a task done or not done by id.",inputSchema:{type:"object",properties:{id:{type:"string"},done:{type:"boolean"}},required:["id"]},
  execute:i=>{S.saved[String(i.id)]=i.done!==false;persist();return{ok:true}}},
 {name:"log_water",description:"Set glasses of water drunk today (0-12).",inputSchema:{type:"object",properties:{glasses:{type:"number"}},required:["glasses"]},
  execute:i=>{S.water[todayStr]=Math.max(0,Math.min(12,Math.round(+i.glasses||0)));persist();return{ok:true}}}
];
async function sendChat(text){
  text=String(text||"").trim();if(!text||chatBusy)return;
  chat.push({role:"user",content:text});chatDraft="";chatBusy=true;liveText="";render();scrollChat();cctl=new AbortController();

  if(AItools){opts.tools=COACH_TOOLS();delete opts.cache}
  try{const r=await AI(turns,opts);chat.push({role:"assistant",content:r.text})}
  catch(e){const m=errMsg(e);if(e?.text)chat.push({role:"assistant",content:e.text});else if(m)chat.push({role:"assistant",content:m});else chat.pop()}

}

  if(b=t.closest("[data-day]")){const g=b.closest("[data-group]").dataset.group,i=+b.dataset.day;
    if(document.getElementById("intro").contains(b))readSchedule("ob-");else readSchedule("st-");
    S[g]=S[g].includes(i)?S[g].filter(x=>x!==i):[...S[g],i].sort();b.classList.toggle("on");b.setAttribute("aria-pressed",S[g].includes(i));return}
  if(b=t.closest("[data-muslim]")){S.muslim=b.dataset.muslim==="1";if(document.getElementById("intro").contains(b))renderIntro();else{const nm=document.getElementById("st-name")?.value;readSchedule("st-");render();if(nm!=null)document.getElementById("st-name").value=nm}return}
  if(b=t.closest("[data-lang]")){S.lang=b.dataset.lang;persist();const io=document.getElementById("intro");if(!S.onboarded)renderIntro();render();return}
  if(b=t.closest("[data-theme-set]")){setTheme(b.dataset.themeSet);b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b=t.closest("[data-sex]")){draftSex=b.dataset.sex;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(!document.getElementById("view").contains(t))return;
  if(b=t.closest("[data-rm]")){e.preventDefault();S.tasks=S.tasks.filter(c=>c.id!==b.dataset.rm);delete S.saved[b.dataset.rm];persist();render();return}
  if(b=t.closest("[data-done]")){S.saved[b.dataset.done]=true;persist();toast("Nice, ticked off ✓");render();return}
  if(b=t.closest("[data-move]")){moveTask(b.dataset.move,b.dataset.md);return}
  if(b=t.closest("[data-go]")){sel=b.dataset.go;go("day");return}
  if(b=t.closest("[data-tab]")){go(b.dataset.tab);return}
  if(b=t.closest("[data-w]")){const n=+b.dataset.w,c=S.water[todayStr]||0;S.water[todayStr]=n===c?n-1:n;persist();render();return}
  if(b=t.closest("[data-rmfood]")){S.food[todayStr]=foodToday().filter(x=>x.id!==b.dataset.rmfood);persist();render();return}
  if(b=t.closest("[data-goal]")){goal=b.dataset.goal;render();return}
  if(b=t.closest("[data-chip]")){sendChat(b.dataset.chip);return}
  if(b=t.closest("[data-seen]")){S.seenTabs=Object.assign({},S.seenTabs,{[b.dataset.seen]:true});persist();render();return}
});
document.getElementById("view").addEventListener("change",e=>{if(e.target.type!=="checkbox")return;S.saved[e.target.id]=e.target.checked;persist();
  if(e.target.checked){const st=dayStats(sel);if(st.c===st.n)toast("Day complete! 🎉")}renderHeader();renderStrip()});
let lastCount=missed().length;
setInterval(()=>{now=new Date();const nd=ds(now);if(nd!==todayStr){todayStr=nd}
  const m=missed().length;if(m>lastCount&&S.onboarded)toast("⏰ A task just slipped. Check Today.");lastCount=m;
  const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(tab==="day"&&!busy&&!adding)render();else renderHeader()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){now=new Date();todayStr=ds(now);if(!adding)render();const m=missed().length;if(m&&S.onboarded)toast(`⏰ ${m} unfinished task${m>1?"s":""}. Catch up on Today.`)}});
applyTheme();
render();
</script>
